name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install CLI
        run: python -m pip install .
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Check both example exit codes
        shell: bash
        run: |
          status=0
          gtm-preflight run examples/broken || status=$?
          test "$status" -eq 1
          gtm-preflight run examples/fixed
      - name: Upload JSON and HTML reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: preflight-${{ matrix.os }}-${{ matrix.python }}
          path: |
            reports/*/report.json
            reports/*/report.html
          retention-days: 7
